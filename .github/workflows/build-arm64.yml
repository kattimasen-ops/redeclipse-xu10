name: Build ARM64 Stable

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            unzip \
            zip \
            findutils \
            libsdl2-dev

      - name: Show repository files
        run: |
          echo "==== ROOT FILES ===="
          ls -la

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          mkdir extracted

          unzip "$ZIP_FILE" -d extracted

          echo "==== EXTRACTED CONTENT ===="
          find extracted -maxdepth 3 -type d

      - name: Detect source directories
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          BASE_DIR=$(dirname "$SRC_DIR")

          echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV

          echo "==== DETECTED ===="
          echo "SRC_DIR=$SRC_DIR"
          echo "BASE_DIR=$BASE_DIR"

      - name: Verify enet exists
        run: |
          if [ ! -d "$SRC_DIR/enet" ]; then
            echo "ERROR: enet folder missing!"
            exit 1
          fi

          echo "enet folder found"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      - name: Build project
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I/usr/include/SDL2 -D_REENTRANT"
          export CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

          make clean || true

          make \
            PLATFORM=linux \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

      - name: Package release
        run: |
          mkdir -p release

          cp -r "$BASE_DIR" release/game

          cd release

          zip -r arm64-build.zip game

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: release/arm64-build.zip
