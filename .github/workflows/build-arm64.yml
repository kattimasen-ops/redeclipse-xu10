name: Redeclipse ARM64 Build (Stable)

on:
  push:
  pull_request:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system
        run: |
          sudo apt-get update

      - name: Install build dependencies (SDL2 ONLY)
        run: |
          sudo apt-get install -y \
            build-essential \
            g++ \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            pkg-config \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev

      - name: Verify SDL2 install
        run: |
          pkg-config --modversion sdl2 || true
          ls /usr/include/SDL2 || true

      - name: Build ENet
        run: |
          cd src/
          Makefile
          make -C enet CC=aarch64-linux-gnu-gcc

      - name: Build Redeclipse (ARM64)
        run: |
          cd base-2.0.0/src
          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-arm64
          path: |
            redeclipse/src/*.bin
            redeclipse/src/*.exe
            redeclipse/src/*/release/*
