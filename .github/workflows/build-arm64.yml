name: Android ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      ########################################################
      # CHECKOUT
      ########################################################

      - name: Checkout
        uses: actions/checkout@v4

      ########################################################
      # FIX UBUNTU MIRRORS
      ########################################################

      - name: Fix Ubuntu mirrors
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

      ########################################################
      # INSTALL DEPENDENCIES
      ########################################################

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            cmake \
            git \
            unzip \
            zip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libx11-dev \
            libgl1-mesa-dev \
            zlib1g-dev

      ########################################################
      # EXTRACT ZIP
      ########################################################

      - name: Extract source
        run: |
          mkdir extracted

          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ZIP FILE NOT FOUND"
            exit 1
          fi

          unzip "$ZIPFILE" -d extracted

          echo "Extracted files:"
          find extracted | head -100

      ########################################################
      # FIND SRC
      ########################################################

      - name: Find src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "SRC DIRECTORY NOT FOUND"
            find extracted
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "Using SRC_DIR:"
          echo "$SRC_DIR"

      ########################################################
      # DOWNLOAD SDL2
      ########################################################

      - name: Download SDL2
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.2/SDL2-2.30.2.tar.gz

          tar -xzf SDL2-2.30.2.tar.gz

      ########################################################
      # BUILD SDL2
      ########################################################

      - name: Build SDL2
        run: |
          cd SDL2-2.30.2

          mkdir build
          cd build

          CC=aarch64-linux-gnu-gcc \
          CXX=aarch64-linux-gnu-g++ \
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DSDL_X11=OFF \
            -DSDL_WAYLAND=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/sdl2-install

          make -j$(nproc)
          make install

      ########################################################
      # EXPORT SDL2 PKGCONFIG
      ########################################################

      - name: Export SDL2 pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sdl2-install/lib/pkgconfig" >> $GITHUB_ENV

          echo "SDL2 pkg-config files:"
          ls $HOME/sdl2-install/lib/pkgconfig || true

      ########################################################
      # BUILD ENET
      ########################################################

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet clean || true

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      ########################################################
      # BUILD ENGINE
      ########################################################

      - name: Build Engine
        run: |
          cd "$SRC_DIR"

          make clean || true

          export PKG_CONFIG_PATH=$HOME/sdl2-install/lib/pkgconfig

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            SDL2_CONFIG=$HOME/sdl2-install/bin/sdl2-config \
            -j$(nproc)

      ########################################################
      # UPLOAD
      ########################################################

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            extracted/**/bin/**
            extracted/**/src/**/*.so
            extracted/**/src/**/*.a
