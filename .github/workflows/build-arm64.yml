name: ARM64 Build Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            make \
            unzip \
            zip \
            findutils \
            pkg-config \
            libsdl2-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Show repository
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

      - name: Find ZIP file
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "ZIP_FILE=$ZIP" >> $GITHUB_ENV

      - name: Extract ZIP
        run: |
          mkdir extracted

          unzip "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED ====="
          find extracted -type d | sort

      - name: Detect valid source directory
        run: |
          VALID_SRC=""

          while IFS= read -r dir
          do
            echo "Checking: $dir"

            if [ -f "$dir/Makefile" ] && [ -d "$dir/enet" ]; then
              VALID_SRC="$dir"
              break
            fi

          done < <(find extracted -type d -name src)

          if [ -z "$VALID_SRC" ]; then
            echo "ERROR: No valid src directory found"
            echo "Need BOTH:"
            echo "- src/Makefile"
            echo "- src/enet/"
            exit 1
          fi

          echo "VALID SRC:"
          echo "$VALID_SRC"

          echo "SRC_DIR=$VALID_SRC" >> $GITHUB_ENV

      - name: Debug source folder
        run: |
          echo "===== SRC CONTENT ====="
          ls -la "$SRC_DIR"

          echo "===== ENET CONTENT ====="
          ls -la "$SRC_DIR/enet"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      - name: Build project
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I/usr/include/SDL2 -D_REENTRANT"
          export CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

          make clean || true

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

      - name: Create release archive
        run: |
          mkdir -p release

          cp -r extracted/* release/

          cd release

          zip -r arm64-build.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: release/arm64-build.zip
