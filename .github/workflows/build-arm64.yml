name: Build ARM64 Red Eclipse (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            unzip \
            build-essential \
            make \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libgl1-mesa-dev \
            zip

      - name: Extract source
        run: |
          unzip base-2.0.0.zip
          mv base-2.0.0 redeclipse

      - name: Build
        run: |
          cd redeclipse/src

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          make \
            CC=$CC \
            CXX=$CXX \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            CLIENT_INCLUDES="-I/usr/include/SDL2 -D_REENTRANT -DSDL_DISABLE_IMMINTRIN_H"

      - name: Package
        run: |
          zip -r redeclipse-arm64.zip redeclipse/src/redeclipse* || true

      - uses: actions/upload-artifact@v4
        with:
          name: redeclipse-arm64
          path: redeclipse-arm64.zip
