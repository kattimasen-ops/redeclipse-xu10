name: ARM64 Build Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            unzip \
            zip \
            make \
            findutils \
            libsdl2-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Show repository
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract ZIP
        run: |
          mkdir extracted

          unzip "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED ====="
          find extracted -type d | sort

      - name: Find src folder
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "SRC_DIR FOUND:"
          echo "$SRC_DIR"

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Verify src content
        run: |
          echo "===== SRC ====="
          ls -la "$SRC_DIR"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      - name: Build project
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I/usr/include/SDL2 -D_REENTRANT"
          export CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

          make clean || true

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

      - name: Create archive
        run: |
          mkdir release

          cp -r extracted/* release/

          cd release

          zip -r arm64-build.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: release/arm64-build.zip
