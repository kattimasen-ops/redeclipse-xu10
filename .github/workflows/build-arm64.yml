name: Build ARM64 Red Eclipse

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cross Toolchain (NO multiarch!)
        run: |
          sudo apt update
          sudo apt install -y \
            unzip \
            build-essential \
            make \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgl1-mesa-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev

      - name: Extract Source
        run: |
          unzip base-2.0.0.zip
          mv base-2.0.0 redeclipse

      - name: Build
        run: |
          cd redeclipse/src

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          make \
            CC=$CC \
            CXX=$CXX \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib \
            CLIENT_INCLUDES="-I/usr/include/SDL2 -D_REENTRANT -DSDL_DISABLE_IMMINTRIN_H"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-arm64
          path: redeclipse/src/redeclipse*
