name: ARM64 Build Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            make \
            unzip \
            zip \
            findutils \
            libsdl2-dev \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Show repository
        run: |
          echo "===== ROOT ====="
          pwd
          ls -la

      - name: Extract ZIP
        run: |
          mkdir extracted

          unzip base-2.0.0.zip -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted | head -200

      - name: Find real src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src not found after extraction"
            exit 1
          fi

          echo "SRC FOUND:"
          echo "$SRC_DIR"

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Verify src contents
        run: |
          echo "===== SRC CONTENT ====="
          ls -la "$SRC_DIR"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      - name: Build game
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I/usr/include/SDL2 -D_REENTRANT"
          export CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

          make clean || true

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

      - name: Create release
        run: |
          mkdir release

          cp -r extracted/* release/

          cd release

          zip -r arm64-build.zip .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: release/arm64-build.zip
