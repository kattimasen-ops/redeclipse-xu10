name: Android ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: findzip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "==== Extracted folders ===="
          find extracted -type d

      - name: Locate src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            echo "Folders:"
            find extracted -type d
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "Found src:"
          echo "$SRC_DIR"

      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://ports.ubuntu.com/ubuntu-ports|g' /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            make \
            unzip \
            zip \
            libx11-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            zlib1g-dev:arm64 \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libsdl2-mixer-dev:arm64

      - name: Verify SDL2 pkg-config
        run: |
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          pkg-config --modversion sdl2
          pkg-config --modversion SDL2_image
          pkg-config --modversion SDL2_mixer

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet clean

          make -C enet \
            CC=aarch64-linux-gnu-gcc

      - name: Build Game
        run: |
          cd "$SRC_DIR"

          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++

      - name: Show build output
        run: |
          echo "==== Build files ===="
          find "$SRC_DIR" -type f | grep -E "linux|client|server|game"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-build
          path: |
            extracted/**/*.so
            extracted/**/*.a
            extracted/**/*.exe
            extracted/**/*.out
            extracted/**/linux_* 
