name: Build ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update

          sudo apt install -y \
            unzip \
            cmake \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libasound2-dev

      - name: Extract source zip
        run: |
          unzip -o base-2.0.0.zip -d extracted

          echo "==== FILE TREE ===="
          find extracted | head -100

      - name: Locate src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "FOUND SRC:"
          echo "$SRC_DIR"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"
          make -C enet

      - name: Build SDL2 locally
        run: |
          git clone --depth 1 --branch release-2.30.2 https://github.com/libsdl-org/SDL.git

          cd SDL

          mkdir build
          cd build

          CC=aarch64-linux-gnu-gcc \
          CXX=aarch64-linux-gnu-g++ \
          cmake .. \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/aarch64-linux-gnu

          make -j$(nproc)

          sudo make install

      - name: Build Game
        run: |
          cd "$SRC_DIR"

          export CXX=aarch64-linux-gnu-g++
          export CC=aarch64-linux-gnu-gcc

          make clean

          make \
            PLATFORM=linux \
            CXX=aarch64-linux-gnu-g++ \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-I/usr/aarch64-linux-gnu/include/SDL2" \
            CXXFLAGS="-I/usr/aarch64-linux-gnu/include/SDL2" \
            LDFLAGS="-L/usr/aarch64-linux-gnu/lib"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-arm64
          path: extracted
