name: R36S Full Build (ARMv7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies (Multi-arch)
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt update
          sudo apt install -y \
            build-essential cmake git unzip wget pkg-config \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libsdl2-dev:armhf libsdl2-image-dev:armhf libsdl2-mixer-dev:armhf \
            zlib1g-dev:armhf libgl1-mesa-dev:armhf

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip *.zip -d extracted
          echo "SRC_DIR=$(find extracted -type d -name src | head -n 1)" >> $GITHUB_ENV

      - name: Build Engine (ARMv7)
        run: |
          cd "$SRC_DIR"
          
          # Force use of armhf cross-compiler
          export CC=arm-linux-gnueabihf-gcc
          export CXX=arm-linux-gnueabihf-g++
          
          # Force pkg-config to look at armhf paths
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          
          echo "==== CONFIGURING BUILD ===="
          # Red Eclipse Makefiles often rely on these variables
          make clean
          
          echo "==== RUNNING MAKE ===="
          # Wir setzen die Arch-Flags direkt mit, falls das Makefile sie nicht automatisch erkennt
          make \
            CC=$CC \
            CXX=$CXX \
            PLATFORM_CFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=neon-vfpv4" \
            PLATFORM_LDFLAGS="-march=armv7-a -mfloat-abi=hard -mfpu=neon-vfpv4" \
            V=1

      - name: Isolate Binary
        run: |
          mkdir -p final-binary
          # Finde die Binärdatei (meist redeclipse_linux oder ähnlich)
          find "$SRC_DIR" -maxdepth 2 -type f -executable -name "redeclipse_*" -exec cp {} final-binary/ \;
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-r36s-binary
          path: final-binary/
