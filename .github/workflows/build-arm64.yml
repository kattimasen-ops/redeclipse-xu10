name: Build ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            unzip \
            git \
            cmake \
            make \
            build-essential \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libasound2-dev

      - name: Extract source archive
        run: |
          mkdir extracted

          unzip -o base-2.0.0.zip -d extracted

          echo "==== EXTRACTED FILES ===="
          find extracted | head -200

      - name: Find src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "FOUND SRC DIR:"
          echo "$SRC_DIR"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet

      - name: Build SDL2 locally
        run: |
          git clone --depth 1 --branch release-2.30.2 \
            https://github.com/libsdl-org/SDL.git

          cd SDL

          mkdir build
          cd build

          CC=aarch64-linux-gnu-gcc \
          CXX=aarch64-linux-gnu-g++ \
          cmake .. \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF

          make -j$(nproc)

      - name: Build Game
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I$GITHUB_WORKSPACE/SDL/include"
          export CXXFLAGS="-I$GITHUB_WORKSPACE/SDL/include"

          make clean

          make \
            PLATFORM=linux \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CLIENT=1 \
            SERVER=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-arm64
          path: extracted
