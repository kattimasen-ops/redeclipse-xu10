name: Hauch ARM64 Stable Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== DIRECTORY TREE ==="
          find . -maxdepth 3 -type d

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            make \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev

      - name: Verify SDL2
        run: |
          echo "=== SDL2 VERSION ==="
          pkg-config --modversion sdl2

          echo "=== SDL2 INCLUDE ==="
          ls /usr/include/SDL2

      - name: Detect source directory
        run: |
          SRC_DIR=$(find . -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "FOUND SRC DIR: $SRC_DIR"

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Verify ENet exists
        run: |
          echo "=== CHECKING ENET ==="

          if [ ! -d "$SRC_DIR/enet" ]; then
            echo "ERROR: enet directory missing!"
            echo "Contents of SRC_DIR:"
            ls -la "$SRC_DIR"
            exit 1
          fi

          echo "ENET FOUND"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet \
            CC=aarch64-linux-gnu-gcc

      - name: Build Hauch ARM64
        run: |
          cd "$SRC_DIR"

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            -j$(nproc)

      - name: Show build results
        run: |
          echo "=== BUILD OUTPUT ==="
          find . -type f | grep -E "\.(bin|exe|so)$" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hauch-arm64-build
          path: |
            **/*.bin
            **/*.exe
            **/*.so
