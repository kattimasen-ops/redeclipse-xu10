name: Build Red Eclipse ARM64 (XU10)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ####################################################################
      # INSTALL TOOLCHAIN + LIBS
      ####################################################################

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            make \
            git \
            zip \
            unzip \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxxf86vm-dev \
            zlib1g-dev

      ####################################################################
      # EXTRACT ZIP
      ####################################################################

      - name: Extract source archive
        run: |
          mkdir extracted

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No zip file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

      ####################################################################
      # FIND SRC DIRECTORY ROBUSTLY
      ####################################################################

      - name: Locate src directory
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            echo "=== DIRECTORY TREE ==="
            find extracted -maxdepth 4 -type d
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "Found src:"
          echo "$SRC_DIR"

      ####################################################################
      # BUILD ENET
      ####################################################################

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet clean || true

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar \
            RANLIB=aarch64-linux-gnu-ranlib

      ####################################################################
      # BUILD RED ECLIPSE
      ####################################################################

      - name: Build Red Eclipse ARM64
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig

          make clean || true

          make -j$(nproc) \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CLIENT=1 \
            SERVER=1

      ####################################################################
      # FIND GENERATED BINARIES
      ####################################################################

      - name: Locate binaries
        run: |
          echo "=== SEARCHING FOR BINARIES ==="

          find extracted -type f | grep -Ei \
            "redeclipse|server|linux|arm|\.so$" || true

      ####################################################################
      # UPLOAD ARTIFACTS
      ####################################################################

      - name: Upload ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-xu10-arm64
          path: |
            extracted/**/redeclipse*
            extracted/**/server*
            extracted/**/*.so
