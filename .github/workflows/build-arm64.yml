name: Android ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      ########################################################
      # CLEAN UBUNTU SOURCES
      ########################################################

      - name: Fix Ubuntu mirrors
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list

      ########################################################
      # INSTALL TOOLCHAIN
      ########################################################

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            autoconf \
            automake \
            libtool \
            make \
            cmake \
            unzip \
            zip \
            wget \
            git \
            libx11-dev \
            libgl1-mesa-dev \
            zlib1g-dev

      ########################################################
      # EXTRACT SOURCE
      ########################################################

      - name: Extract source
        run: |
          mkdir extracted

          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ZIP NOT FOUND"
            exit 1
          fi

          unzip "$ZIPFILE" -d extracted

          echo "FILES:"
          find extracted | head -100

      ########################################################
      # FIND SRC
      ########################################################

      - name: Find src
        run: |
          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "SRC NOT FOUND"
            find extracted
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "FOUND:"
          echo "$SRC_DIR"

      ########################################################
      # BUILD SDL2
      ########################################################

      - name: Build SDL2
        run: |
          git clone https://github.com/libsdl-org/SDL.git SDL

          cd SDL

          mkdir build
          cd build

          CC=aarch64-linux-gnu-gcc \
          CXX=aarch64-linux-gnu-g++ \
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DSDL_STATIC=ON \
            -DSDL_SHARED=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/sdl-install

          make -j$(nproc)
          make install

      ########################################################
      # EXPORT PKG-CONFIG
      ########################################################

      - name: Export SDL pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sdl-install/lib/pkgconfig" >> $GITHUB_ENV

          pkg-config --list-all | grep SDL || true

      ########################################################
      # BUILD ENET
      ########################################################

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          make -C enet clean || true

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      ########################################################
      # BUILD ENGINE
      ########################################################

      - name: Build Engine
        run: |
          cd "$SRC_DIR"

          make clean || true

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            -j$(nproc)

      ########################################################
      # ARTIFACTS
      ########################################################

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            extracted/**/bin/**
            extracted/**/src/**/*.so
            extracted/**/src/**/*.a
