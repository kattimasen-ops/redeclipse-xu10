name: Android ARM64 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################################
      # INSTALLATION
      ######################################################################

      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            make \
            zip \
            unzip \
            pkg-config \
            git \
            wget \
            curl \
            python3 \
            openjdk-17-jdk \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libgl1-mesa-dev \
            libx11-dev \
            zlib1g-dev

      ######################################################################
      # FIND AND EXTRACT SOURCE ZIP
      ######################################################################

      - name: Extract Source Archive
        run: |
          set -e

          mkdir extracted

          ZIP_FILE=$(find . -maxdepth 2 \( -iname "*.zip" -o -iname "*.7z" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP archive found!"
            exit 1
          fi

          echo "Found archive:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction complete"

          echo "Folder structure:"
          find extracted -maxdepth 4 -type d

      ######################################################################
      # FIND REAL SRC DIRECTORY
      ######################################################################

      - name: Locate Source Directory
        run: |
          set -e

          SRC_DIR=$(find extracted -type d -name src | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            echo "Detected folders:"
            find extracted -type d
            exit 1
          fi

          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

          echo "Detected src folder:"
          echo "$SRC_DIR"

      ######################################################################
      # BUILD ENET
      ######################################################################

      - name: Build ENet
        run: |
          set -e

          cd "$SRC_DIR"

          if [ ! -d "enet" ]; then
            echo "ERROR: enet folder missing!"
            exit 1
          fi

          make -C enet clean || true

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      ######################################################################
      # FIX SDL2 PKG-CONFIG
      ######################################################################

      - name: Setup SDL2 pkg-config aliases
        run: |
          set -e

          mkdir -p fake-pkgconfig

          cat > fake-pkgconfig/sdl2.pc <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include/SDL2

          Name: sdl2
          Description: SDL2
          Version: 2.0
          Cflags: -I\${includedir}
          Libs: -lSDL2
          EOF

          cat > fake-pkgconfig/SDL2_image.pc <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include/SDL2

          Name: SDL2_image
          Description: SDL2_image
          Version: 2.0
          Cflags: -I\${includedir}
          Libs: -lSDL2_image
          EOF

          cat > fake-pkgconfig/SDL2_mixer.pc <<EOF
          prefix=/usr
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include/SDL2

          Name: SDL2_mixer
          Description: SDL2_mixer
          Version: 2.0
          Cflags: -I\${includedir}
          Libs: -lSDL2_mixer
          EOF

          echo "PKG_CONFIG_PATH=$(pwd)/fake-pkgconfig" >> $GITHUB_ENV

      ######################################################################
      # BUILD GAME
      ######################################################################

      - name: Build Game
        run: |
          set -e

          cd "$SRC_DIR"

          make clean || true

          make \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            STRIP=aarch64-linux-gnu-strip \
            PLATFORM=linux \
            -j$(nproc)

      ######################################################################
      # COLLECT BINARIES
      ######################################################################

      - name: Collect Artifacts
        run: |
          mkdir -p build-output

          find extracted -type f \( -name "*.so" -o -name "*.a" -o -executable \) \
            -exec cp {} build-output/ \; || true

          echo "Collected files:"
          ls -la build-output

      ######################################################################
      # UPLOAD
      ######################################################################

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-android-arm64
          path: build-output
