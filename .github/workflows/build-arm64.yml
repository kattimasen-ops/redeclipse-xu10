name: R36S Build (ARMv7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf cmake git unzip zip wget

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip *.zip -d extracted
          echo "SRC_DIR=$(find extracted -type d -name src | head -n 1)" >> $GITHUB_ENV

      - name: Build SDL2 (32-bit)
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.2/SDL2-2.30.2.tar.gz
          tar -xzf SDL2-2.30.2.tar.gz
          cd SDL2-2.30.2
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DSDL_STATIC=ON -DSDL_SHARED=OFF -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DCMAKE_INSTALL_PREFIX=$HOME/sdl2-install
          make -j$(nproc)
          make install

      - name: Build Engine (32-bit)
        run: |
          cd "$SRC_DIR"
          # Wir setzen die Variablen direkt für den Make-Prozess
          make \
            CC=arm-linux-gnueabihf-gcc \
            CXX=arm-linux-gnueabihf-g++ \
            SDL2_CONFIG=$HOME/sdl2-install/bin/sdl2-config \
            PLATFORM_LIBS="-L$HOME/sdl2-install/lib -lSDL2" \
            PLATFORM_INCLUDES="-I$HOME/sdl2-install/include" \
            V=1

      - name: Isolate Binary
        run: |
          mkdir -p final-binary
          # Suche nach der Engine-Binary (oft im src-Ordner oder root)
          find "$SRC_DIR" -maxdepth 2 -type f -executable -name "redeclipse_*" -exec cp {} final-binary/ \;
          
          echo "==== Architektur-Prüfung ===="
          file final-binary/* || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redeclipse-r36s-armv7
          path: final-binary/
