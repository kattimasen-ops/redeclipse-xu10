name: Build ARM64 Stable

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-arm64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            cmake \
            git \
            zip \
            unzip \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libsdl2-dev

      - name: Show repository structure
        run: |
          echo "==== ROOT ===="
          ls -la

          echo "==== SEARCHING SRC ===="
          find . -type d -name src

      - name: Auto-detect source directory
        id: detect
        run: |
          SRC_DIR=$(find . -type d -path "*/src" | head -n 1)

          if [ -z "$SRC_DIR" ]; then
            echo "ERROR: src directory not found!"
            exit 1
          fi

          echo "Found src directory:"
          echo "$SRC_DIR"

          BASE_DIR=$(dirname "$SRC_DIR")

          echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV
          echo "SRC_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Verify folders
        run: |
          echo "BASE_DIR=$BASE_DIR"
          echo "SRC_DIR=$SRC_DIR"

          ls -la "$BASE_DIR"
          ls -la "$SRC_DIR"

      - name: Build ENet
        run: |
          cd "$SRC_DIR"

          if [ ! -d "enet" ]; then
            echo "ERROR: enet folder missing!"
            exit 1
          fi

          make -C enet \
            CC=aarch64-linux-gnu-gcc \
            AR=aarch64-linux-gnu-ar

      - name: Build game
        run: |
          cd "$SRC_DIR"

          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          export CFLAGS="-I/usr/include/SDL2 -D_REENTRANT"
          export CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

          make clean || true

          make \
            PLATFORM=linux \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            CXXFLAGS="-I/usr/include/SDL2 -D_REENTRANT"

      - name: Package build
        run: |
          mkdir -p release

          cp -r "$BASE_DIR" release/game

          cd release

          zip -r arm64-build.zip game

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm64-build
          path: release/arm64-build.zip
